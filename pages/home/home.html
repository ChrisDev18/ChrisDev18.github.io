<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chris Wilson</title>

    <link rel="stylesheet" href="../typography.css">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
</head>

<body>
    <section class="Hero">
        <div id="header-div">
            <h1>Chris Wilson</h1>

            <div class="Scroll Large">
                <img class="text" alt="Web dev, UI design, Software, Full-Stack"
                     src="./assets/ScrollText.svg"/>

            </div>
        </div>

        <div id="second-div">
            <div id="left">
                <img id="hero-background" src="./assets/BlurBackground.svg" alt="abstract backdrop"/>

                <p>Hey there, my name’s Chris.</p>
                <p>Thanks for visiting my site! Take a look around and please explore my portfolio of work.</p>

                <button>
                    See some of my work
                    <span class="Icon-Container">
                        <span id="Chevron" class="material-symbols-outlined">chevron_right</span>
                        <span id="Arrow" class="material-symbols-outlined">arrow_forward</span>
                    </span>
                </button>

            </div>

            <div id="hero-portrait">
                <img id="overlay" src="./assets/bio-overlay.png" alt="bio photo"/>
            </div>
        </div>
    </section>

</body>
</html>
